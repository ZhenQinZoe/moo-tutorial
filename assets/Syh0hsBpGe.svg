<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Shared speech model and constrained encoder update</title><desc id="desc">Multilingual speech passes through a shared Conformer encoder to recognition heads, translation heads, and an acoustic prediction module. Supervised encoder gradients are balanced, while the acoustic gradient is weighted by a separate penalty. Their sum updates the shared encoder. Solid arrows indicate forward computation; dashed arrows indicate encoder-gradient contributions.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#606060"/></marker></defs>
