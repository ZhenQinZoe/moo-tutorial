<text x="582.0" y="111.14" text-anchor="middle" font-size="21" font-weight="600" fill="#4E4E4E">heads</text>
<rect x="480" y="220" width="204" height="90" rx="10" fill="#FFF2C8" stroke="#606060" stroke-width="2"/>
<text x="582.0" y="258.14" text-anchor="middle" font-size="21" font-weight="600" fill="#4E4E4E">Translation</text>
