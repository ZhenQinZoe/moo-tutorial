<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="618" viewBox="0 0 1200 618" role="img" aria-labelledby="title desc">
<title id="title">EA-SURF preference calibration during speech-model adaptation</title><desc id="desc">A fixed preference determines target distance shares. Measured recognition, timestamp, and translation token cross-entropies are compared with three fixed specialist loss vectors, each containing all three task losses. Euclidean distances are normalized into attained distance shares. Comparing attained and target shares determines a multiplicative adjustment and renormalization of the loss weights. Training then continues from the current model, with task sampling fixed.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#606060"/></marker></defs>
<rect width="1200" height="618" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#4E4E4E" stroke-linejoin="round" stroke-linecap="round">
<rect x="35" y="45" width="240" height="95" rx="10" fill="#D8E5EC" stroke="#606060" stroke-width="2"/>
<text x="155" y="86.8" text-anchor="middle" font-size="20" font-weight="600" fill="#4E4E4E">Requested preference</text>
<text x="155" y="119" text-anchor="middle" font-size="18" font-weight="400" fill="#686868">Fixed throughout</text>
<rect x="340" y="45" width="260" height="95" rx="10" fill="#D8E5EC" stroke="#606060" stroke-width="2"/>
<text x="470.0" y="85.98" text-anchor="middle" font-size="22" font-weight="600" fill="#4E4E4E">Target distance</text>
<text x="470.0" y="113.98" text-anchor="middle" font-size="22" font-weight="600" fill="#4E4E4E">shares</text>
<rect x="675" y="210" width="225" height="100" rx="10" fill="#F5F5F3" stroke="#606060" stroke-width="2"/>
<text x="787.5" y="253.14" text-anchor="middle" font-size="21" font-weight="600" fill="#4E4E4E">Compare attained</text>
<text x="787.5" y="281.14" text-anchor="middle" font-size="21" font-weight="600" fill="#4E4E4E">and target shares</text>
<rect x="960" y="210" width="220" height="100" rx="10" fill="#F5F5F3" stroke="#606060" stroke-width="2"/>
<text x="1070" y="248.8" text-anchor="middle" font-size="20" font-weight="600" fill="#4E4E4E">Update loss weights</text>
<text x="1070" y="276" text-anchor="middle" font-size="17" font-weight="400" fill="#4E4E4E">Multiply and normalize</text>
<rect x="35" y="390" width="240" height="155" rx="10" fill="#F5F5F3" stroke="#606060" stroke-width="2"/>
<text x="155" y="428.48" text-anchor="middle" font-size="22" font-weight="600" fill="#4E4E4E">Fixed specialist</text>
<text x="155" y="456.48" text-anchor="middle" font-size="22" font-weight="600" fill="#4E4E4E">loss vectors</text>
<text x="155" y="496.62" text-anchor="middle" font-size="18" font-weight="400" fill="#4E4E4E">All three losses</text>
<text x="155" y="519.62" text-anchor="middle" font-size="18" font-weight="400" fill="#4E4E4E">for each specialist</text>
<rect x="340" y="390" width="260" height="155" rx="10" fill="#F5F5F3" stroke="#606060" stroke-width="2"/>
<text x="470" y="423.48" text-anchor="middle" font-size="22" font-weight="600" fill="#4E4E4E">Attained distance</text>
<text x="470" y="451.48" text-anchor="middle" font-size="22" font-weight="600" fill="#4E4E4E">shares</text>
<text x="470" y="493.78" text-anchor="middle" font-size="17" font-weight="400" fill="#4E4E4E">Euclidean distances,</text>
<text x="470" y="517.78" text-anchor="middle" font-size="17" font-weight="400" fill="#4E4E4E">normalized across specialists</text>
<rect x="650" y="390" width="260" height="155" rx="10" fill="#F5F5F3" stroke="#606060" stroke-width="2"/>
<text x="780" y="419" text-anchor="middle" font-size="20" font-weight="600" fill="#4E4E4E">Measure training losses</text>
<rect x="667" y="432" width="226" height="29" rx="5" fill="#FCE6CD" stroke="#606060" stroke-width="2"/>
<text x="780" y="453" text-anchor="middle" font-size="18" font-weight="400" fill="#4E4E4E">Recognition</text>
<rect x="667" y="467" width="226" height="29" rx="5" fill="#E7E0EE" stroke="#606060" stroke-width="2"/>
<text x="780" y="488" text-anchor="middle" font-size="18" font-weight="400" fill="#4E4E4E">Timestamps</text>
<rect x="667" y="502" width="226" height="29" rx="5" fill="#FFF2C8" stroke="#606060" stroke-width="2"/>
<text x="780" y="523" text-anchor="middle" font-size="18" font-weight="400" fill="#4E4E4E">Translation</text>
<rect x="960" y="390" width="220" height="155" rx="10" fill="#D8E5EC" stroke="#606060" stroke-width="2"/>
<text x="1070" y="435.14" text-anchor="middle" font-size="21" font-weight="600" fill="#4E4E4E">Continue training</text>
<text x="1070" y="463.14" text-anchor="middle" font-size="21" font-weight="600" fill="#4E4E4E">the same model</text>
<text x="1070" y="509" text-anchor="middle" font-size="18" font-weight="400" fill="#4E4E4E">Updated loss weights</text>
<path d="M275,92.5 L340,92.5" fill="none" stroke="#606060" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600,92.5 L787.5,92.5 L787.5,210" fill="none" stroke="#606060" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M900,260 L960,260" fill="none" stroke="#606060" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1070,310 L1070,390" fill="none" stroke="#606060" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M960,467.5 L910,467.5" fill="none" stroke="#606060" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M650,467.5 L600,467.5" fill="none" stroke="#606060" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M275,467.5 L340,467.5" fill="none" stroke="#606060" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M470,390 L470,260 L675,260" fill="none" stroke="#606060" stroke-width="2" marker-end="url(#arrow)"/>
<text x="780" y="580" text-anchor="middle" font-size="18" font-weight="400" fill="#686868">Token cross-entropies</text>
<text x="1070" y="580" text-anchor="middle" font-size="18" font-weight="400" fill="#686868">Task sampling stays fixed</text>
</g></svg>