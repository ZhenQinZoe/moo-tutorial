<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="744" viewBox="0 0 1200 744" role="img" aria-labelledby="title desc">
<title id="title">Three ways to organize multilingual speech objectives</title><desc id="desc">VS-MSP balances automatic speech recognition, speech-to-text translation, and acoustic gradients together. VC-MSP balances supervised gradients and adds a separate acoustic penalty. VM-MSP balances recognition and translation separately. The USA hierarchy places recognition at the upper level, translation at the middle level, and acoustic learning at the lower level, with separate translation and acoustic penalties. All contributions enter one shared encoder update.</desc>
